<style>
/* Layout: ticket de depósito en una sola columna angosta, pensada para el pulgar y para usar con guantes.
   Color: hormigón claro y tinta casi negra; el color solo marca la etapa de cada pieza. */
:root {
  --bg: #F2F2F0;
  --surface: #FFFFFF;
  --ink: #111214;
  --ink-2: #54575C;
  --line: #DADAD6;
  --accent: #E41417;
  --btn: #E41417;
  --btn-fg: #FFFFFF;
  --danger: #B3261E;
  --s0: #858D93;  --s0-bg: #E3E6E3;  --s0-t: #3E464B;
  --s1: #C27803;  --s1-bg: #FAEBCB;  --s1-t: #6E4300;
  --s2: #2563A8;  --s2-bg: #DCE8F6;  --s2-t: #1B4A82;
  --s3: #23744C;  --s3-bg: #D5EBDF;  --s3-t: #145336;
  --display: "Saira Stencil One", "Arial Black", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F10; --surface: #1A1B1D; --ink: #F2F2EF; --ink-2: #A5A8AD; --line: #2C2E31;
    --btn: #E41417; --btn-fg: #FFFFFF; --danger: #FF8A84;
    --s0: #8B949A; --s0-bg: #262D31; --s0-t: #C3CACE;
    --s1: #E3A33A; --s1-bg: #3A2D12; --s1-t: #F1C171;
    --s2: #6FA8E8; --s2-bg: #172B44; --s2-t: #A9CDF5;
    --s3: #5BBF8A; --s3-bg: #153A2A; --s3-t: #9BDDB9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F10; --surface: #1A1B1D; --ink: #F2F2EF; --ink-2: #A5A8AD; --line: #2C2E31;
  --btn: #E41417; --btn-fg: #FFFFFF; --danger: #FF8A84;
  --s0: #8B949A; --s0-bg: #262D31; --s0-t: #C3CACE;
  --s1: #E3A33A; --s1-bg: #3A2D12; --s1-t: #F1C171;
  --s2: #6FA8E8; --s2-bg: #172B44; --s2-t: #A9CDF5;
  --s3: #5BBF8A; --s3-bg: #153A2A; --s3-t: #9BDDB9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--s2); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.top::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 56px; height: 4px; background: var(--accent); }
.logo { display: block; flex: none; height: 22px; width: 140.8px; color: var(--ink); }
.lm { fill: var(--accent); }
.lr { fill: currentColor; }
.cap { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }

.btn { min-height: 54px; padding: 0 20px; border-radius: 10px; border: 1.5px solid var(--ink); background: transparent; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--btn); color: var(--btn-fg); }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-text { min-height: 48px; border: 0; background: none; padding: 0 4px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }

h1, h2 { margin: 0; text-wrap: balance; }
h1 { font: 400 30px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; }
h2 { font: 400 18px/1.15 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec > h2, .ph { color: var(--ink-2); font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
.gcount { font: 600 13px/1 var(--mono); letter-spacing: 0; color: var(--ink); border: 1.5px solid var(--ink-2); border-radius: 6px; padding: 2px 6px; }
.note { margin: 0; color: var(--ink-2); font-size: 14px; }
.date { font: 500 12px/1.2 var(--mono); letter-spacing: .04em; color: var(--ink-2); text-transform: uppercase; }

.st0 { --c: var(--s0); --cb: var(--s0-bg); --ct: var(--s0-t); }
.st1 { --c: var(--s1); --cb: var(--s1-bg); --ct: var(--s1-t); }
.st2 { --c: var(--s2); --cb: var(--s2-bg); --ct: var(--s2-t); }
.st3 { --c: var(--s3); --cb: var(--s3-bg); --ct: var(--s3-t); }

.card { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-top { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-name { font: 400 21px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.card.fin { opacity: .72; }

.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.bar.big { height: 14px; border-radius: 7px; }
.bar span { display: block; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); }
.legend b { font: 500 13px/1 var(--mono); color: var(--ink); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 52ch; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 600 13px/1.2 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.field input, .field textarea { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 52px; }
.field textarea { min-height: 190px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--s2-bg); }
#prev { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.prev { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.prev li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.prev li:first-child { border-top: 0; }
.prev li > span:first-child { min-width: 0; }
.count { margin: 0; font: 600 14px/1.3 var(--body); }

.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: none; }
.qty { font: 600 14px/1 var(--mono); border: 1.5px solid var(--ink); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
.kind { font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; border: 1.5px solid var(--ink-2); color: var(--ink-2); white-space: nowrap; }
.kind.k-combo { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.kind.k-ban { border-style: dashed; }
.kind.k-pro { border-style: dotted; }

.head { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.head h1 { overflow-wrap: anywhere; }
.sum { display: flex; flex-direction: column; gap: 10px; }
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.tab i { font: 500 13px/1 var(--mono); font-style: normal; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] i { color: var(--bg); }

.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
.body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.txt { font-size: 18px; font-weight: 500; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.piezas { font: 500 12px/1.3 var(--mono); color: var(--ink-2); }
.item.tachada .txt span.t { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--c); color: var(--ink-2); }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; background: var(--cb); color: var(--ct); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; }
.acts { display: flex; gap: 8px; }
.act { flex: 1; min-height: 52px; border-radius: 10px; border: 1.5px solid var(--c); background: var(--cb); color: var(--ct); font-weight: 600; font-size: 16px; padding: 0 12px; }
.sub { flex: 1; min-height: 52px; border-radius: 10px; border: 1.5px dashed var(--c); background: transparent; color: var(--ct); font-weight: 600; font-size: 15px; line-height: 1.2; padding: 6px 10px; }
.sub.on { border-style: solid; background: var(--cb); }
.undo { flex: none; min-height: 52px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.ok { margin: 0; padding: 14px; border-radius: 12px; background: var(--s3-bg); color: var(--s3-t); font-weight: 600; border: 1.5px solid var(--s3); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm p { margin: 0; flex: 1 1 100%; font-weight: 600; }
.foot { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 608px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 14px 16px; border-radius: 12px; font-weight: 500; z-index: 20; }
.btn-machete { justify-content: space-between; width: 100%; }
.mc { font: 500 12px/1 var(--mono); letter-spacing: .04em; color: var(--ink-2); text-transform: uppercase; }
.field input[type="search"] { -webkit-appearance: none; appearance: none; }
#md { min-height: 120px; }
.mlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.mhead h2 { font-size: 21px; letter-spacing: .03em; overflow-wrap: anywhere; min-width: 0; }
.mdet { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }

/* ---- segunda tanda visual ---- */
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 14px; height: 14px; stroke-width: 2.5; }
.pill .ic { width: 14px; height: 14px; stroke-width: 2.5; }
.tab .ic { width: 16px; height: 16px; }
.act { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.act .ic { width: 22px; height: 22px; }
.okic { width: 20px; height: 20px; color: var(--s3); margin-right: 6px; vertical-align: -3px; stroke-width: 3; }

.pz { min-height: 92px; border-radius: 12px; border: 1.5px dashed var(--c); background: transparent; color: var(--ct); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 6px; min-width: 0; }
.pz-alf { flex: 3; }
.pz-ban { flex: 2; }
.pz.on { border-style: solid; background: var(--cb); }
.pz-row { display: flex; gap: 8px; align-items: flex-end; justify-content: center; }
.pz-it { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 500 10px/1 var(--mono); letter-spacing: .02em; text-transform: uppercase; }
.pz-it .ic { width: 38px; height: 38px; opacity: .6; }
.pz.on .pz-it .ic { opacity: 1; fill: currentColor; fill-opacity: .22; }
.pz-cap { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 14px; line-height: 1.15; text-align: center; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--cb); border: 1.5px solid var(--c); color: var(--ct); border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile b { font: 600 36px/1 var(--mono); color: var(--ink); }
.tile span { font: 600 11px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; overflow-wrap: anywhere; }
.tile.zero { opacity: .55; }

.mrow { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 12px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; border: 1.5px solid var(--ink-2); color: var(--ink); }
.chip.pos { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.mm { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.brand { border-color: var(--ink); }
.chip.note { border-style: dashed; color: var(--ink-2); }
.car { width: 44px; height: 80px; flex: none; }
.car .cb { fill: none; stroke: var(--ink-2); stroke-width: 2; }
.car .cl { fill: var(--ink-2); }
.car .z { fill: var(--line); }
.car .z.on { fill: var(--accent); }


/* ---- cantidades parciales, edicion y logo en bandejas ---- */
.acts { flex-wrap: wrap; }
.act { min-width: 118px; }
.srow { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.srow + .srow { border-top: 1px dashed var(--line); padding-top: 12px; }
.srow-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 500 14px/1.25 var(--body); color: var(--ink-2); }
.srow-h b { font: 600 22px/1 var(--mono); color: var(--ink); margin-right: 5px; }
.srow-h small { font-size: 12px; }
.stpw { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.stp-l { font: 600 10px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.stp { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.stp button { width: 46px; height: 44px; border: 0; background: transparent; font: 600 22px/1 var(--body); color: var(--ink); }
.stp button:disabled { opacity: .28; cursor: not-allowed; }
.stp output { min-width: 40px; text-align: center; font: 600 18px/1 var(--mono); }
.mini { flex: none; width: 44px; height: 44px; margin: -6px -6px 0 0; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; }
.kind.k-new { background: var(--accent); border-color: var(--accent); color: #fff; }
.item.editing { gap: 12px; }
.danger { color: var(--danger); }
.field .tabs { padding-bottom: 2px; }
@keyframes pop {
  0% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); }
  35% { transform: scale(1.02); box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 30%, transparent); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.item.flash { animation: pop .55s ease-out; }
.ok { display: flex; align-items: center; gap: 12px; font-size: 17px; }
.ok .ic { width: 36px; height: 36px; stroke-width: 2.5; }
.ok.celebra { --c: var(--s3); animation: pop .9s ease-out; }
.ok.celebra .ck { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s .15s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; .ok.celebra .ck { stroke-dashoffset: 0; } } }
@media (max-width: 380px) { h1 { font-size: 26px; } }
@media (max-width: 340px) { .cap { display: none; } }
</style>

<script>
(function () {
  'use strict';

  /* PARSE-START */
  var PREF_A = /^\[?\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[ap]\.?\s?m\.?)?\]?\s*(?:[-–]\s*)?[^:\n]{1,40}:\s*/i;
  var PREF_B = /^\[\d{1,2}:\d{2}(?::\d{2})?,?\s+\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}\]\s*[^:\n]{1,40}:\s*/;
  var BUL = /^(?:[-–—•*·▪▫]|\p{Extended_Pictographic}️?|\d{1,3}[.)])\s*/u;
  var QTY = /(^|\s)\(?(?:x\s?(\d{1,3})|(\d{1,3})\s?x)\)?(?=\s|$|[.,;])/i;
  var HEAD = /^(bandejas?|protectores?|alfombras|combos?)\s*:?$/i;
  var HEADK = { b: 'ban', p: 'pro', a: 'alf', c: 'combo' };

  function sacarCant(t) {
    var c = 1, m = t.match(QTY);
    if (m) {
      c = parseInt(m[2] || m[3], 10);
      t = (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
    } else {
      m = t.match(/^(\d{1,2})\s+(?=\p{L})/u);
      if (m) { c = parseInt(m[1], 10); t = t.slice(m[0].length).trim(); }
    }
    if (!c || c < 1) c = 1;
    return { t: t, c: c };
  }

  function quitar(t, re) {
    var r = t.replace(re, ' ').replace(/\s+/g, ' ').trim();
    return r || t;
  }

  function tipo(t, sec) {
    if (sec === 'ban') return { k: 'ban', t: quitar(t, /^bandejas?\b/i) };
    if (sec === 'pro') return { k: 'pro', t: quitar(t, /^protectores?\b/i) };
    if (/\bcombos?\b/i.test(t)) return { k: 'combo', t: quitar(t, /\bcombos?\b/i) };
    if (/^bandejas?\b/i.test(t)) return { k: 'ban', t: quitar(t, /^bandejas?\b/i) };
    if (/^protectores?\b/i.test(t)) return { k: 'pro', t: quitar(t, /^protectores?\b/i) };
    return { k: sec || 'alf', t: t };
  }

  function parseMsg(text, defSec, noTitle) {
    var rows = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var s = line.trim();
      if (!s) return;
      var r = s.replace(PREF_A, '');
      if (r === s) r = s.replace(PREF_B, '');
      s = r.trim();
      for (var n = 0; n < 5 && s; n++) {
        var b = s.replace(BUL, '');
        if (b === s) break;
        s = b.trim();
      }
      if (!/[\p{L}\d]/u.test(s)) return;
      rows.push(s);
    });
    var explicit = rows.some(function (s) { return QTY.test(s); });
    var title = '', sec = defSec || null, items = [];
    rows.forEach(function (s, idx) {
      var h = s.match(HEAD);
      if (h) { sec = HEADK[h[1].charAt(0).toLowerCase()]; return; }
      if (!noTitle && idx === 0 && explicit && !QTY.test(s) && s.length <= 40) { title = s; return; }
      var q = sacarCant(s);
      if (!q.t) return;
      var ty = tipo(q.t, sec);
      items.push({ t: ty.t, c: q.c, k: ty.k });
    });
    return { title: title, items: items };
  }
  /* PARSE-END */

  var STAGES = [
    { n: 'Por sacar', pl: 'Por sacar', lg: 'por sacar' },
    { n: 'Sacada', pl: 'Sacadas', lg: 'sacadas' },
    { n: 'Limpia', pl: 'Limpias / logo', lg: 'limpias' },
    { n: 'Embalada', pl: 'Listas', lg: 'listas' }
  ];
  var KINDS = { combo: 'Combo', alf: 'Alfombras', ban: 'Bandeja', pro: 'Protector' };
  var GROUPS = [
    { n: 'Alfombras', ks: ['alf'] },
    { n: 'Combos', ks: ['combo'] },
    { n: 'Bandejas', ks: ['ban'] },
    { n: 'Protectores', ks: ['pro'] }
  ];
  var ACT = ['Marcar sacada', 'Marcar limpia'];
  var STAGE_IC = ['i-espera', 'i-sacar', 'i-limpiar', 'i-check'];
  var ACT_IC = ['i-sacar', 'i-limpiar'];
  var lastE = {}, lastDone = {};
  var qsel = {}, edit = null, addD = { texto: '', sec: null };
  var BRANDS = [['megmart', 'Megmart'], ['ford', 'Ford'], ['chevrolet', 'Chevrolet'], ['fiat', 'Fiat'], ['volkswagen', 'VW'], ['toyota', 'Toyota'], ['jeep', 'Jeep'], ['peugeot', 'Peugeot'], ['renault', 'Renault'], ['citroen', 'Citroën'], ['honda', 'Honda'], ['nissan', 'Nissan']];
  function ic(id, cls) {
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function firstStage(it) {
    for (var s = 0; s < 4; s++) if (it.n[s] > 0) return s;
    return 3;
  }
  function stName(k, s) { return (k === 'ban' && s === 2) ? 'Con logo' : STAGES[s].n; }
  function lgName(k, s) { return (k === 'ban' && s === 2) ? 'con logo' : STAGES[s].lg; }
  function stIc(it) {
    var e = firstStage(it);
    if (e === 3) return it.k === 'pro' ? 'i-check' : (it.bb ? 'i-bolsa' : 'i-caja');
    if (e === 2 && it.k === 'ban') return 'i-logo';
    return STAGE_IC[e];
  }
  function getQ(key, max, def) {
    var q = qsel[key] === undefined ? def : qsel[key];
    return Math.max(1, Math.min(max, q));
  }
  function qFor(pid, it, s) { return getQ(pid + '/' + it.id + '/' + s, it.n[s], s === 3 ? 1 : it.n[s]); }
  function resetQ(pid, iid) {
    Object.keys(qsel).forEach(function (k) { if (k.indexOf(pid + '/' + iid + '/') === 0) delete qsel[k]; });
  }
  function stepV(key, q, max) {
    return '<span class="stp" role="group" aria-label="Cantidad">' +
      '<button type="button" data-a="q" data-d="-1" data-k="' + key + '" data-m="' + max + '" aria-label="Menos"' + (q <= 1 ? ' disabled' : '') + '>−</button>' +
      '<output>' + q + '</output>' +
      '<button type="button" data-a="q" data-d="1" data-k="' + key + '" data-m="' + max + '" aria-label="Más"' + (q >= max ? ' disabled' : '') + '>+</button></span>';
  }
  function findItem(pid, iid) {
    var pp = getP(pid), r = null;
    if (pp) pp.items.forEach(function (x) { if (x.id === iid) r = x; });
    return r;
  }
  function mover(it, s, dir, q, b) {
    var n = it.n.slice(), bb = it.bb, bc = it.bc;
    if (dir === 'f') {
      q = Math.min(q, n[s]);
      if (q < 1) return null;
      if (s === 0 && it.k === 'pro') { n[0] -= q; n[3] += q; }
      else if (s === 2) { n[2] -= q; n[3] += q; if (b === 'bolsa') bb += q; else bc += q; }
      else { n[s] -= q; n[s + 1] += q; }
    } else if (s === 3 && it.k !== 'pro') {
      var have = b === 'bolsa' ? bb : bc;
      q = Math.min(q, have);
      if (q < 1) return null;
      n[3] -= q; n[2] += q;
      if (b === 'bolsa') bb -= q; else bc -= q;
    } else {
      q = Math.min(q, n[s]);
      if (q < 1) return null;
      n[s] -= q;
      n[s === 3 ? 0 : s - 1] += q;
    }
    return { n: n, pa: Math.min(it.pa, n[0]), pb: Math.min(it.pb, n[0]), bb: bb, bc: bc };
  }
  function ajustarCantidad(it, nc) {
    var n = it.n.slice(), bb = it.bb, bc = it.bc;
    if (nc > it.c) {
      n[0] += nc - it.c;
    } else {
      var r = it.c - nc;
      for (var s = 0; s < 4 && r > 0; s++) {
        var take = Math.min(r, n[s]);
        n[s] -= take; r -= take;
        if (s === 3 && it.k !== 'pro') {
          var tb = Math.min(take, bb);
          bb -= tb; bc -= take - tb;
        }
      }
    }
    return { c: nc, n: n, pa: Math.min(it.pa, n[0]), pb: Math.min(it.pb, n[0]), bb: bb, bc: bc };
  }
  function itemNuevo(l, o, ag) {
    var it = { t: l.t, c: l.c, k: l.k, o: o, n: [l.c, 0, 0, 0], pa: 0, pb: 0, bb: 0, bc: 0 };
    if (ag) it.ag = Date.now();
    return it;
  }
  var LS = 'megmart-pedidos-v1';
  var EJEMPLO = 'CA\n\nX2 Combo Cronos cubre manija Megmart\nX1 Toro doble capa\nX1 Combo Logan\nX1 Taos\n\nBandejas\n\nX1 Taos\nX2 WR-V\n\nProtectores\n\nX1 Citroen';

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var db = null, src = 'pending', ready = false;
  var raw = [];
  var view = { n: 'home' };
  var filtro = -1, confirmDel = null;
  var borrador = { nombre: '', texto: '' };
  var toastT = null;
  var queues = {};
  var LSM = 'megmart-machete-v1';
  var mach = [], canEditM = false, mq = '', confirmM = false;
  var mform = { id: null, modelo: '', detalle: '' };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function norm(r) {
    var its = r.items || {};
    var arr = Object.keys(its).map(function (key) {
      var x = its[key] || {};
      var k = KINDS[x.k] ? x.k : 'alf';
      var c = Math.max(1, parseInt(x.c, 10) || 1);
      var n, pa = 0, pb = 0, bb = 0, bc = 0, ok = false;
      if (Array.isArray(x.n) && x.n.length === 4) {
        n = x.n.map(function (v) { return Math.max(0, parseInt(v, 10) || 0); });
        var sum = n[0] + n[1] + n[2] + n[3];
        if (sum > 0) { c = sum; ok = true; }
      }
      if (ok) {
        pa = Math.min(n[0], Math.max(0, parseInt(x.pa, 10) || 0));
        pb = Math.min(n[0], Math.max(0, parseInt(x.pb, 10) || 0));
        if (k !== 'pro') {
          bb = Math.max(0, parseInt(x.bb, 10) || 0);
          bc = Math.max(0, parseInt(x.bc, 10) || 0);
          while (bb + bc > n[3]) { if (bb > 0) bb--; else bc--; }
          if (bb + bc < n[3]) bc += n[3] - bb - bc;
        }
      } else {
        var e = Math.min(3, Math.max(0, parseInt(x.e, 10) || 0));
        if (k === 'pro' && e > 0) e = 3;
        n = [0, 0, 0, 0]; n[e] = c;
        if (e === 0) { pa = x.pa ? c : 0; pb = x.pb ? c : 0; }
        if (e === 3 && k !== 'pro') { if (x.b === 'bolsa') bb = c; else bc = c; }
      }
      return { id: key, t: String(x.t || ''), c: c, o: x.o || 0, k: k, n: n, pa: pa, pb: pb, bb: bb, bc: bc, ag: !!x.ag };
    });
    arr.sort(function (a, b) { return a.o - b.o; });
    var cnt = [0, 0, 0, 0], total = 0;
    arr.forEach(function (i) { for (var s = 0; s < 4; s++) cnt[s] += i.n[s]; total += i.c; });
    return { id: r.id, nombre: r.nombre || '', creado: r.creado || 0, items: arr, cnt: cnt, total: total, done: total > 0 && cnt[3] === total };
  }
  function getP(id) {
    for (var i = 0; i < raw.length; i++) if (raw[i].id === id) return norm(raw[i]);
    return null;
  }
  function fmtFecha(ts) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleString('es-AR', { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, '');
    } catch (e) { return ''; }
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.hidden = true; }, 5000);
  }
  function errMsg(e) {
    var c = e && e.code;
    if (c === 'invalid_argument') return 'No tenés permiso para hacer este cambio. Pedile a quien publicó la app que te dé acceso.';
    if (c === 'quota_exceeded') return 'Se llenó el espacio de la app. Eliminá pedidos terminados.';
    return 'No se pudo guardar el cambio. Probá de nuevo.';
  }

  /* ---------- almacenamiento ---------- */
  function loadLocal() {
    try { raw = JSON.parse(localStorage.getItem(LS) || '[]') || []; } catch (e) { raw = []; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS, JSON.stringify(raw)); } catch (e) { /* sin almacenamiento */ }
  }
  function enqueue(pid, fn) {
    var p = (queues[pid] || Promise.resolve()).then(fn);
    queues[pid] = p.catch(function () {});
    return p;
  }

  function crearPedido(nombre, lines) {
    var items = {};
    lines.forEach(function (l, i) {
      items['i' + i] = itemNuevo(l, i, false);
    });
    var data = { nombre: nombre, creado: Date.now(), items: items };
    if (db) {
      return db.collection('pedidos').add(data).then(function (ref) { return ref.id; });
    }
    var id = 'l' + Date.now().toString(36);
    raw.unshift({ id: id, nombre: data.nombre, creado: data.creado, items: data.items });
    saveLocal();
    return Promise.resolve(id);
  }
  function patchItem(pid, iid, patch) {
    if (db) {
      var body = {}; body.items = {}; body.items[iid] = patch;
      return enqueue(pid, function () { return db.doc('pedidos/' + pid).update(body); })
        .catch(function (e) { toast(errMsg(e)); });
    }
    raw.forEach(function (r) {
      if (r.id === pid && r.items && r.items[iid]) {
        Object.keys(patch).forEach(function (k) { r.items[iid][k] = patch[k]; });
      }
    });
    saveLocal();
    renderKeep();
    return Promise.resolve();
  }
  function agregarItems(pid, lines) {
    var cur = getP(pid);
    var o = 0;
    if (cur) cur.items.forEach(function (x) { if (x.o >= o) o = x.o + 1; });
    var add = {}, stamp = Date.now().toString(36);
    lines.forEach(function (l, i) { add['a' + stamp + i] = itemNuevo(l, o + i, true); });
    if (db) {
      return enqueue(pid, function () { return db.doc('pedidos/' + pid).update({ items: add }); });
    }
    raw.forEach(function (r) {
      if (r.id === pid) {
        r.items = r.items || {};
        Object.keys(add).forEach(function (k) { r.items[k] = add[k]; });
      }
    });
    saveLocal();
    return Promise.resolve();
  }
  function borrarItem(pid, iid) {
    if (db) {
      var cur = null;
      raw.forEach(function (r) { if (r.id === pid) cur = r; });
      if (!cur) return Promise.resolve();
      var doc = { nombre: cur.nombre || '', creado: cur.creado || 0, items: {} };
      Object.keys(cur.items || {}).forEach(function (k) { if (k !== iid) doc.items[k] = cur.items[k]; });
      return enqueue(pid, function () { return db.doc('pedidos/' + pid).set(doc); })
        .catch(function (e) { toast(errMsg(e)); });
    }
    raw.forEach(function (r) { if (r.id === pid && r.items) delete r.items[iid]; });
    saveLocal();
    renderKeep();
    return Promise.resolve();
  }

  /* ---------- machete de logos ---------- */
  var MACHETE_VER = 3;
  var MACHETE_INICIAL = [["BASALT", "Solo conductor, logo Megmart"], ["S10", "Full logo Chevrolet"], ["BOREAL", "Solo conductor, logo Megmart"], ["CAPTIVA", "Solo conductor, logo Chevrolet +"], ["LOGAN SANDERO STEP", "Solo conductor, logo Megmart"], ["SAVEIRO", "Logo Megmart, solo conductor"], ["SPING", "Full logo Chevrolet"], ["STRADA", "Logo Megmart, conductor"], ["CRONOS ARGO", "Solo conductor, logo Megmart"], ["JOLION 2025", "Solo conductor, logo Megmart"], ["TORO DOBLE CAPA", "Logo Megmart, solo conductor (costado a la derecha)"], ["TRACKER", "Full logo Chevrolet"], ["AMAROK DISEÑO NUEVO", "Solo conductor, logo Megmart"], ["FORD TERRITORY", "Solo conductor, logo Ford (fijarse en WhatsApp)"]];
  var MACHETE_CAMBIOS = [["S10", "Full logo Chevrolet", 2], ["SAVEIRO", "Logo Megmart, solo conductor", 2], ["SPING", "Full logo Chevrolet", 2], ["STRADA", "Logo Megmart, conductor", 2], ["TORO DOBLE CAPA", "Logo Megmart, solo conductor (costado a la derecha)", 2], ["TRACKER", "Full logo Chevrolet", 2], ["CAPTIVA", "Solo conductor, logo Chevrolet +", 3]];
  function claveM(x) { return sinAcentos(x).replace(/\s+/g, ' ').trim(); }
  function setVerM() {
    try { localStorage.setItem(LSM + '-ver', String(MACHETE_VER)); } catch (e) { /* sin almacenamiento */ }
  }
  function loadLocalM() {
    var s = null, v = 0;
    try { s = localStorage.getItem(LSM); v = parseInt(localStorage.getItem(LSM + '-ver'), 10) || 0; } catch (e) { s = null; }
    if (s === null) {
      mach = MACHETE_INICIAL.map(function (m, i) { return { id: 'm' + i, modelo: m[0], detalle: m[1] }; });
      saveLocalM(); setVerM();
      return;
    }
    try { mach = JSON.parse(s) || []; } catch (e) { mach = []; }
    if (v < MACHETE_VER) {
      MACHETE_CAMBIOS.forEach(function (c, i) {
        if (c[2] <= v) return;
        var k = claveM(c[0]), hit = null;
        mach.forEach(function (m) { if (claveM(m.modelo) === k) hit = m; });
        if (hit) hit.detalle = c[1];
        else mach.push({ id: 'm' + Date.now().toString(36) + i, modelo: c[0], detalle: c[1] });
      });
      saveLocalM(); setVerM();
    }
  }
  function saveLocalM() {
    try { localStorage.setItem(LSM, JSON.stringify(mach)); } catch (e) { /* sin almacenamiento */ }
  }
  function guardarMachete(id, data) {
    if (db) return id ? db.doc('machete/' + id).set(data) : db.collection('machete').add(data);
    if (id) {
      mach = mach.map(function (m) { return m.id === id ? { id: id, modelo: data.modelo, detalle: data.detalle } : m; });
    } else {
      mach.push({ id: 'l' + Date.now().toString(36), modelo: data.modelo, detalle: data.detalle });
    }
    saveLocalM();
    return Promise.resolve();
  }
  function borrarMachete(id) {
    if (db) return db.doc('machete/' + id).delete();

    saveLocalM();
    return Promise.resolve();
  }

    }
    lastDone[p.id] = p.done;
    h += '<button class="btn btn-block" data-a="agregar">' + ic('i-plus') + 'Agregar productos</button>';
    var tabs = '<div class="filters"><div class="tabs" role="tablist">' +
      '<button class="tab" role="tab" data-a="filtro" data-f="-1" aria-selected="' + (filtro === -1) + '">Todo <i>' + p.total + '</i></button>';
    for (var s = 0; s < 4; s++) {
      tabs += '<button class="tab" role="tab" data-a="filtro" data-f="' + s + '" aria-selected="' + (filtro === s) + '">' + ic(STAGE_IC[s]) + STAGES[s].pl + ' <i>' + p.cnt[s] + '</i></button>';
    }
    h += tabs + '</div></div>';
    var list = p.items.filter(function (i) { return filtro === -1 || i.n[filtro] > 0; });
    if (!list.length) {
      h += '<p class="note">No hay productos en esta etapa.</p>';
    } else {
      GROUPS.forEach(function (g) {
        var gi = list.filter(function (i) { return g.ks.indexOf(i.k) > -1; });
        if (!gi.length) return;
        h += '<section class="sec"><h2>' + g.n + ' <span class="gcount">' + gi.length + '</span></h2><ul class="items">' +
          gi.map(function (i) { return itemV(p.id, i); }).join('') + '</ul></section>';
      });
    }
    h += '<div class="foot">';
    if (confirmDel === p.id) {
      h += '<div class="confirm"><p>¿Eliminar este pedido? No se puede deshacer.</p>' +
        '<button class="btn btn-danger" data-a="borrar-si" data-p="' + esc(p.id) + '">Sí, eliminar</button>' +
        '<button class="btn" data-a="borrar-no">Cancelar</button></div>';
    } else {
      h += '<button class="btn-text" data-a="borrar" data-p="' + esc(p.id) + '">Eliminar pedido</button>';
    }
    return h + '</div>';
  }

  function sinAcentos(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function macheteInfo(txt) {
    var t = sinAcentos(txt);
    var pos = { c: /conductor/.test(t), a: /acompa/.test(t), t: /trasera|atras/.test(t) };
    if (!pos.c && !pos.a && !pos.t && /\btodas?\b|\btodo\b|\bfull\b/.test(t)) pos = { c: true, a: true, t: true };
    var chips = [], nombres = [];
    if (pos.c) nombres.push('Conductor');
    if (pos.a) nombres.push('Acompañante');
    if (pos.t) nombres.push('Trasera');
    if (nombres.length === 3) chips.push({ t: 'Las 3 alfombras', c: 'pos' });
    else if (nombres.length === 1 && /\bsolo\b/.test(t)) chips.push({ t: 'Solo ' + nombres[0].toLowerCase(), c: 'pos' });
    else if (nombres.length) chips.push({ t: nombres.join(' + '), c: 'pos' });
    if (/chapita larga/.test(t)) chips.push({ t: 'Chapita larga', c: 'note' });
    var logo = /\blogos?\b/.test(t);
    var found = BRANDS.filter(function (b) { return t.indexOf(b[0]) > -1; }).map(function (b) { return { n: b[1], mm: b[0] === 'megmart' }; });
    if (/\bvw\b/.test(t) && !found.some(function (f) { return f.n === 'VW'; })) found.push({ n: 'VW', mm: false });
    found.forEach(function (f) { chips.push({ t: (logo ? 'Logo ' : '') + f.n, c: f.mm ? 'mm' : 'brand' }); });
    if (/derech/.test(t)) chips.push({ t: 'Costado derecho', c: 'note' });
    if (/izquierd/.test(t)) chips.push({ t: 'Costado izquierdo', c: 'note' });
    if (/whatsapp/.test(t)) chips.push({ t: 'Ver WhatsApp', c: 'note' });
    return { pos: pos, chips: chips };
  }
  function carV(pos) {
    if (!pos.c && !pos.a && !pos.t) return '';
    function z(on, x, y, w, h) {
      return '<rect class="z' + (on ? ' on' : '') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"/>';
    }
    var que = [];
    if (pos.c) que.push('conductor');
    if (pos.a) que.push('acompañante');
    if (pos.t) que.push('trasera');
    return '<svg class="car" viewBox="0 0 48 88" role="img" aria-label="Alfombras indicadas: ' + que.join(', ') + '">' +
      '<rect class="cb" x="5" y="3" width="38" height="82" rx="15"/>' +
      '<rect class="cl" x="11" y="7" width="8" height="3" rx="1.5"/><rect class="cl" x="29" y="7" width="8" height="3" rx="1.5"/>' +
      z(pos.c, 10, 20, 13, 22) + z(pos.a, 25, 20, 13, 22) + z(pos.t, 10, 50, 28, 24) + '</svg>';
  }
  function mcardV(m) {
    var inf = macheteInfo(m.detalle);
    var chips = inf.chips.length
      ? '<div class="chips">' + inf.chips.map(function (c) { return '<span class="chip ' + c.c + '">' + esc(c.t) + '</span>'; }).join('') + '</div>'
      : '';
    return '<li class="mcard"><div class="mhead"><h2>' + esc(m.modelo) + '</h2>' +
      (canEditM ? '<button class="btn-text" data-a="meditar" data-m="' + esc(m.id) + '">Editar</button>' : '') +
      '</div><div class="mrow">' + carV(inf.pos) + '<div class="mcol">' + chips + '<p class="mdet">' + esc(m.detalle) + '</p></div></div></li>';
  }
  function macheteListV() {
    if (!mach.length) {
      return '<section class="empty"><h2>Todavía no hay modelos</h2><p>' +
        (canEditM ? 'Tocá Agregar modelo para cargar el primero.' : 'Cuando se carguen modelos van a aparecer acá.') + '</p></section>';
    }
    var q = sinAcentos(mq).trim();
    var list = mach.slice().sort(function (a, b) { return a.modelo.localeCompare(b.modelo, 'es'); })
      .filter(function (m) { return !q || sinAcentos(m.modelo + ' ' + m.detalle).indexOf(q) > -1; });
    if (!list.length) return '<p class="note">No hay modelos que coincidan con la búsqueda.</p>';
    return '<ul class="mlist">' + list.map(mcardV).join('') + '</ul>';
  }
  function macheteV() {
    return header() +
      '<div><button class="btn-text" data-a="home">← Pedidos</button></div>' +
      '<div class="head"><span class="date">Qué logo va en cada alfombra</span><h1>Machete de logos</h1></div>' +
      '<div class="field"><label for="mq">Buscar modelo</label>' +
      '<input id="mq" type="search" autocomplete="off" value="' + esc(mq) + '" placeholder="Ej: Toro, Territory, S10"></div>' +
      (canEditM ? '<button class="btn btn-block" data-a="mnuevo">Agregar modelo</button>' : '') +
      '<div id="mlist">' + macheteListV() + '</div>';
  }
  function mformV() {
    var ok = mform.modelo.trim() && mform.detalle.trim();
    return header() +
      '<div><button class="btn-text" data-a="machete">← Machete</button></div>' +
      '<h1>' + (mform.id ? 'Editar modelo' : 'Nuevo modelo') + '</h1>' +
      '<div class="field"><label for="mm">Modelo</label>' +
      '<input id="mm" type="text" autocomplete="off" value="' + esc(mform.modelo) + '" placeholder="Ej: TORO DOBLE CAPA"></div>' +
      '<div class="field"><label for="md">Dónde va cada logo</label>' +
      '<textarea id="md" placeholder="Ej: Solo conductor, logo Megmart">' + esc(mform.detalle) + '</textarea></div>' +
      '<button class="btn btn-primary btn-block" id="mguardar" data-a="mguardar"' + (ok ? '' : ' disabled') + '>Guardar</button>' +
      (mform.id ? (confirmM
        ? '<div class="confirm"><p>¿Eliminar este modelo?</p><button class="btn btn-danger" data-a="mborrar-si">Sí, eliminar</button><button class="btn" data-a="mborrar-no">Cancelar</button></div>'
        : '<button class="btn-text" data-a="mborrar">Eliminar modelo</button>') : '');
  }

  function render() {
    var tabs = app.querySelector('.tabs');
    var sl = tabs ? tabs.scrollLeft : 0;
    app.innerHTML = view.n === 'nuevo' ? nuevoV() : view.n === 'pedido' ? pedidoV() :
      view.n === 'machete' ? macheteV() : view.n === 'mform' ? mformV() : view.n === 'agregar' ? agregarV() : homeV();
    var t2 = app.querySelector('.tabs');
    if (t2 && sl) t2.scrollLeft = sl;
  }
  function renderKeep() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  /* ---------- eventos ---------- */
  app.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'nm') borrador.nombre = t.value;
    if (t.id === 'at') {
      addD.texto = t.value;
      var ra0 = parseMsg(addD.texto, addD.sec, true);
      document.getElementById('aprev').innerHTML = previewHtml(ra0);
      document.getElementById('aok').disabled = !ra0.items.length;
    }
    if (t.id === 'en' && edit) edit.t = t.value;
    if (t.id === 'ec' && edit) {
      edit.c = t.value;
      var itw = findItem(edit.p, edit.i), ww = itw ? warnTxt(itw) : '', ew = document.getElementById('ewarn');
      if (ew) { ew.textContent = ww; ew.hidden = !ww; }
    }
    if (t.id === 'mq') { mq = t.value; document.getElementById('mlist').innerHTML = macheteListV(); }
    if (t.id === 'mm' || t.id === 'md') {
      if (t.id === 'mm') mform.modelo = t.value; else mform.detalle = t.value;
      document.getElementById('mguardar').disabled = !(mform.modelo.trim() && mform.detalle.trim());
    }
    if (t.id === 'ta') {
      borrador.texto = t.value;
      document.getElementById('prev').innerHTML = previewV();
      document.getElementById('crear').disabled = !parseMsg(borrador.texto).items.length;
    }
  });

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]');
    if (!b) return;
    var a = b.getAttribute('data-a');
    var d = b.dataset;
    if (a === 'nuevo') { view = { n: 'nuevo' }; render(); window.scrollTo(0, 0); }
    else if (a === 'home') { view = { n: 'home' }; confirmDel = null; edit = null; render(); window.scrollTo(0, 0); }
    else if (a === 'abrir') { view = { n: 'pedido', id: d.p }; filtro = -1; confirmDel = null; lastE = {}; lastDone = {}; edit = null; render(); window.scrollTo(0, 0); }
    else if (a === 'filtro') { filtro = parseInt(d.f, 10); renderKeep(); }
    else if (a === 'mov') {
      var it0 = findItem(d.p, d.i);
      if (!it0) return;
      var s0 = parseInt(d.s, 10);
      var st0 = mover(it0, s0, d.d, qFor(d.p, it0, s0), d.b);
      if (st0) { resetQ(d.p, d.i); patchItem(d.p, d.i, st0); }
    }
    else if (a === 'parte') {
      var it1 = findItem(d.p, d.i);
      if (!it1) return;
      var rem = it1.n[0] - it1[d.part], np = { pa: it1.pa, pb: it1.pb }, n1 = it1.n.slice();
      if (rem > 0) np[d.part] += Math.min(qFor(d.p, it1, 0), rem);
      else if (it1.c === 1) np[d.part] = 0;
      else return;
      var mm = Math.min(np.pa, np.pb);
      if (mm > 0) { n1[0] -= mm; n1[1] += mm; np.pa -= mm; np.pb -= mm; }
      resetQ(d.p, d.i);
      patchItem(d.p, d.i, { n: n1, pa: np.pa, pb: np.pb, bb: it1.bb, bc: it1.bc });
    }
    else if (a === 'parteundo') {
      var it2 = findItem(d.p, d.i);
      if (!it2) return;
      var pu = { pa: it2.pa, pb: it2.pb };
      pu[d.part] = Math.max(0, pu[d.part] - Math.min(qFor(d.p, it2, 0), pu[d.part]));
      resetQ(d.p, d.i);
      patchItem(d.p, d.i, { n: it2.n, pa: pu.pa, pb: pu.pb, bb: it2.bb, bc: it2.bc });
    }
    else if (a === 'q') {
      var mx = parseInt(d.m, 10), ss = d.k.split('/').pop();
      qsel[d.k] = Math.max(1, Math.min(mx, getQ(d.k, mx, ss === '3' ? 1 : mx) + parseInt(d.d, 10)));
      renderKeep();
    }
    else if (a === 'editar') {
      var it3 = findItem(d.p, d.i);
      if (!it3) return;
      edit = { p: d.p, i: d.i, t: it3.t, c: String(it3.c), conf: false };
      renderKeep();
    }
    else if (a === 'editar-no') { edit = null; renderKeep(); }
    else if (a === 'editar-ok') {
      if (!edit) return;
      var it4 = findItem(edit.p, edit.i);
      var nm = (edit.t || '').trim(), nc = parseInt(edit.c, 10);
      if (!it4) { edit = null; renderKeep(); return; }
      if (!nm) { toast('El nombre no puede quedar vacío.'); return; }
      if (!nc || nc < 1 || nc > 999) { toast('La cantidad tiene que estar entre 1 y 999.'); return; }
      var aj = ajustarCantidad(it4, nc);
      aj.t = nm;
      var pe = edit.p, ie = edit.i;
      edit = null; resetQ(pe, ie);
      patchItem(pe, ie, aj);
      renderKeep();
    }
    else if (a === 'eliminar') { if (edit) { edit.conf = true; renderKeep(); } }
    else if (a === 'eliminar-no') { if (edit) { edit.conf = false; renderKeep(); } }
    else if (a === 'eliminar-si') {
      if (!edit) return;
      var pd = edit.p, id2 = edit.i;
      edit = null; resetQ(pd, id2);
      borrarItem(pd, id2);
      renderKeep();
    }
    else if (a === 'agregar') { addD = { texto: '', sec: null }; view = { n: 'agregar', id: view.id }; render(); window.scrollTo(0, 0); }
    else if (a === 'asec') { addD.sec = d.v || null; render(); }
    else if (a === 'agregar-ok') {
      var ra = parseMsg(addD.texto, addD.sec, true);
      if (!ra.items.length) return;
      b.disabled = true;
      var pidA = view.id;
      agregarItems(pidA, ra.items).then(function () {
        toast('Se agregaron ' + ra.items.length + (ra.items.length === 1 ? ' línea' : ' líneas') + ' al pedido.');
        addD = { texto: '', sec: null };
        view = { n: 'pedido', id: pidA };
        render();
        window.scrollTo(0, 0);
      }).catch(function (e) { b.disabled = false; toast(errMsg(e)); });
    }
    else if (a === 'machete') { view = { n: 'machete' }; confirmM = false; render(); window.scrollTo(0, 0); }
    else if (a === 'mnuevo') { mform = { id: null, modelo: '', detalle: '' }; confirmM = false; view = { n: 'mform' }; render(); window.scrollTo(0, 0); }
    else if (a === 'meditar') {
      var mf = null;
      mach.forEach(function (m) { if (m.id === d.m) mf = m; });
      if (!mf) return;
      mform = { id: mf.id, modelo: mf.modelo, detalle: mf.detalle };
      confirmM = false; view = { n: 'mform' }; render(); window.scrollTo(0, 0);
    }
    else if (a === 'mguardar') {
      var mdat = { modelo: mform.modelo.trim(), detalle: mform.detalle.trim() };
      if (!mdat.modelo || !mdat.detalle) return;
      b.disabled = true;
      guardarMachete(mform.id, mdat).then(function () {
        view = { n: 'machete' }; render(); window.scrollTo(0, 0);
      }).catch(function (e) { b.disabled = false; toast(errMsg(e)); });
    }
    else if (a === 'mborrar') { confirmM = true; render(); }
    else if (a === 'mborrar-no') { confirmM = false; render(); }
    else if (a === 'mborrar-si') {
      b.disabled = true;
      borrarMachete(mform.id).then(function () {
        confirmM = false; view = { n: 'machete' }; render(); window.scrollTo(0, 0);
      }).catch(function (e) { b.disabled = false; toast(errMsg(e)); });
    }
    else if (a === 'ejemplo') { borrador.texto = EJEMPLO; if (!borrador.nombre) borrador.nombre = 'Pedido de ejemplo'; render(); }
    else if (a === 'crear') {
      var r = parseMsg(borrador.texto);
      if (!r.items.length) return;
      b.disabled = true;
      crearPedido(borrador.nombre.trim() || r.title, r.items).then(function (id) {
        borrador = { nombre: '', texto: '' };
        view = { n: 'pedido', id: id, t: Date.now() };
        filtro = -1;
        render();
        window.scrollTo(0, 0);
        setTimeout(function () { if (view.n === 'pedido') renderKeep(); }, 4200);
      }).catch(function (e) { b.disabled = false; toast(errMsg(e)); });
    }
    else if (a === 'borrar') { confirmDel = d.p; renderKeep(); }
    else if (a === 'borrar-no') { confirmDel = null; renderKeep(); }
    else if (a === 'borrar-si') {
      confirmDel = null;
      view = { n: 'home' };
      render();
      window.scrollTo(0, 0);
      borrarPedido(d.p);
    }
  });

  /* ---------- arranque ---------- */
  render();
  (async function () {
    try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) {
      src = 'local'; loadLocal(); loadLocalM(); canEditM = true; ready = true; render();
      return;
    }
    src = 'db';
    try {
      var us = await window.claude.use('user');
      canEditM = !!(us && await us.canEdit());
    } catch (e) { canEditM = false; }
    try {
      db.collection('pedidos').orderBy('creado', 'desc').limit(100).onSnapshot(function (snap) {
        raw = snap.docs.map(function (d) {
          var x = d.data() || {};
          return { id: d.id, nombre: x.nombre, creado: x.creado, items: x.items };
        });
        ready = true;
        if (view.n === 'home' || view.n === 'pedido') renderKeep();
      }, function (e) {
        ready = true;
        toast('Se perdió la conexión con los pedidos compartidos. Recargá la página.');
        if (view.n === 'home' || view.n === 'pedido') renderKeep();
      });
      db.collection('machete').orderBy('modelo').limit(500).onSnapshot(function (snap) {
        mach = snap.docs.map(function (d) {
          var x = d.data() || {};
          return { id: d.id, modelo: String(x.modelo || ''), detalle: String(x.detalle || '') };
        });
        var ml = document.getElementById('mlist');
        if (view.n === 'machete' && ml) ml.innerHTML = macheteListV();
        else if (view.n === 'home') renderKeep();
      }, function () { /* sin machete compartido */ });
    } catch (e) {
      db = null; src = 'local'; loadLocal(); loadLocalM(); canEditM = true; ready = true; render();
    }
  })();
})();
</script>
</body>
</html>
